name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python3 scripts/validate.py

      - name: Test isolated installation
        run: |
          codex_home="$(mktemp -d)"
          user_skills_dir="$(mktemp -d)"
          python3 scripts/install.py \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir"
          python3 "$user_skills_dir/solweaver/scripts/validate_install.py" \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir"
          test ! -e "$user_skills_dir/solweaver/scripts/__pycache__"

      - name: Test backup-on-upgrade installation
        run: |
          codex_home="$(mktemp -d)"
          user_skills_dir="$(mktemp -d)"
          python3 scripts/install.py \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir"
          if python3 scripts/install.py \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir"; then
            echo "installer unexpectedly overwrote an existing skill"
            exit 1
          fi
          mkdir -p "$codex_home/skills"
          cp -R "$user_skills_dir/solweaver" "$codex_home/skills/solweaver"
          python3 scripts/install.py \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir" \
            --upgrade
          test -d "$codex_home/backups"
          test ! -e "$codex_home/skills/solweaver"
          python3 "$user_skills_dir/solweaver/scripts/validate_install.py" \
            --codex-home "$codex_home" \
            --user-skills-dir "$user_skills_dir"
          test ! -e "$user_skills_dir/solweaver/scripts/__pycache__"
